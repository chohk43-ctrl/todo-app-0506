<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Todo List</h1>

    <div class="tabs">
      <button class="tab active" data-tab="all">전체 보기</button>
      <button class="tab" data-tab="active">진행중</button>
      <button class="tab" data-tab="done">완료</button>
    </div>

    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="할 일을 입력하세요..." />
      <button type="submit">추가</button>
    </form>

    <ul id="todo-list"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
